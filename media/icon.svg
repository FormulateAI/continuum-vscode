<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="ring" x1="60" y1="60" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="core" x1="96" y1="96" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#e040fb"/>
    </linearGradient>
    <linearGradient id="arc1" x1="40" y1="128" x2="128" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="arc2" x1="128" y1="216" x2="216" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Outer flowing arcs — represent continuous context flow -->
  <path d="M128 48 A80 80 0 0 1 208 128" stroke="url(#arc1)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M128 208 A80 80 0 0 1 48 128" stroke="url(#arc2)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Middle orbit ring -->
  <circle cx="128" cy="128" r="56" stroke="url(#ring)" stroke-width="4" fill="none" opacity="0.6"/>

  <!-- Inner core — the memory hub -->
  <circle cx="128" cy="128" r="28" fill="url(#core)" opacity="0.9"/>

  <!-- Central symbol — three dots representing connected memories -->
  <circle cx="128" cy="118" r="4" fill="#ffffff"/>
  <circle cx="120" cy="134" r="4" fill="#ffffff"/>
  <circle cx="136" cy="134" r="4" fill="#ffffff"/>

  <!-- Connecting lines between dots -->
  <line x1="128" y1="118" x2="120" y2="134" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="128" y1="118" x2="136" y2="134" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
  <line x1="120" y1="134" x2="136" y2="134" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

  <!-- Orbiting nodes — representing different IDE contexts -->
  <circle cx="72" cy="128" r="8" fill="#4fc3f7"/>
  <circle cx="184" cy="128" r="8" fill="#e040fb"/>
  <circle cx="128" cy="72" r="8" fill="#7c4dff"/>
  <circle cx="128" cy="184" r="8" fill="#4fc3f7"/>
</svg>
